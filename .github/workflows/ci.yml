name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

# v2 and main get a push every few minutes while the builders work; cancelling the running job on every push meant
# that no run ever finished. On those two branches the running job completes and only the newest waiting run
# follows it; pull requests still cancel their older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v2' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e suite (camera, pose, render kits, the Road Run gate run) takes about 10 minutes on a desktop.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests (headless)
        run: npm run test:e2e

      - name: Keep the e2e report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
