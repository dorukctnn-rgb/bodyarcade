<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BodyArcade results</title>
<meta name="description" content="UI kit: the end of a round. The score against your line, honest stats, why moves missed with a one second skeleton replay, and the next step.">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="pages.css">
<style>
  .k-game { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; }
  .k-game img { width: 48px; height: 36px; border-radius: 9px; object-fit: cover; }
  .k-pb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--ba-sun-400); color: var(--ba-ink-900); font-weight: 800; font-size: var(--ba-text-sm); }
  .k-pb svg { width: 18px; height: 18px; }
  .k-reach { display: grid; gap: 8px; }
  .k-reach .row { display: flex; justify-content: space-between; font-weight: 700; font-size: var(--ba-text-sm); }
  .k-kcal { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .k-kcal b { font-weight: 800; font-size: 1.25rem; }
  @media (min-width: 900px) { .k-cols > .k-stack:nth-child(2) { grid-column: 2; grid-row: 1 / span 2; } .k-cols > .k-actionbar { grid-column: 1; grid-row: 2; align-self: start; margin-top: 0; } }
  .k-procard { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>
</head>
<body class="ba-app no-tabbar">
<main class="ba-page" id="page"></main>
<script type="module" data-wait>
import { mountShell, pageHead, ICON, artSrc, GAMES, ready } from './shell.mjs';
import { cameraArt } from './art.mjs';

mountShell('arcade');
const misses = [['Hips 4 cm above the line', 'Squat a little deeper; the bird needs the full flap.', 7, 0.6], ['Came up too fast', 'Under half a second at the bottom. Pause, then rise.', 3, 0.66], ['Out of view for a moment', 'Your feet left the frame. Step back 20 cm.', 2, 0.7]];
const pro = GAMES.filter((g) => g.tier === 'pro').length;
const page = document.getElementById('page');
page.innerHTML = `
  ${pageHead('Round complete', { back: 'home.html', actions: `<button class="ba-icon-btn" type="button" aria-label="Share your result">${ICON.share}</button>` })}
  <div class="k-cols" style="margin-top:14px">
    <div class="k-stack">
      <div class="ba-row-wrap" style="justify-content:space-between"><span class="k-game"><img src="${artSrc('squat-flap')}" alt="" width="48" height="36">Squat Flap, Normal</span><span class="k-pb">${ICON.star}New personal best</span></div>
      <div class="k-score"><span class="n">64</span><span class="u">squats in 5 minutes<small>Your best before was 58. The deepest went 6 cm below your line.</small></span></div>
      <div class="k-card k-reach">
        <div class="row"><span>Reached the line</span><span>52 of 64</span></div>
        <div class="k-linebar" role="img" aria-label="52 of 64 squats reached the line"><i style="width:${(52 / 64) * 100}%"></i></div>
      </div>
      <div class="k-stats">
        <div><b>5:00</b><span>Time</span></div>
        <div><b>4:41</b><span>Active time</span></div>
        <div><b>21</b><span>Best streak</span></div>
        <div><b>81%</b><span>Form</span></div>
      </div>
      <div class="k-kcal"><b>About 38 kcal</b><span class="ba-small">An estimate from your weight and how long you moved.</span></div>
    </div>
    <div class="k-stack">
      <section aria-labelledby="why"><h2 id="why" class="k-h3" style="margin-bottom:10px">Why moves missed</h2>
        <ul class="k-misses">${misses.map(([t, d, n, line]) => `<li><span class="thumb">${cameraArt({ w: 128, h: 128, pose: 'squat', skeleton: true, line, lineLabel: '', dim: true })}</span><div><b>${t}</b><small>${d}</small></div><span class="x">${n}x</span></li>`).join('')}</ul>
      </section>
      <section class="k-card k-replay" aria-labelledby="replay">
        <h2 id="replay" class="k-h3" style="margin:0">One second replay</h2>
        <div class="view" role="img" aria-label="Skeleton replay of a missed move: hips 4 cm above the line">${cameraArt({ w: 400, h: 300, pose: 'squat', skeleton: true, line: 0.6, lineLabel: '4 cm to go', dim: true })}</div>
        <div class="scrub"><button class="ba-icon-btn" type="button" aria-label="Replay">${ICON.replay}</button><span class="track"><i></i><em></em></span><span class="ba-small">0.6 s</span></div>
        <p class="k-fine">Only your skeleton is kept for this, never the video.</p>
      </section>
      <div class="k-card k-procard"><p style="margin:0;max-width:26em">Pro adds ${pro} more games and the Hard and Expert difficulty.</p><a class="ba-link" href="paywall.html">See Pro</a></div>
    </div>
  <div class="k-actionbar"><div class="k-actions" style="max-width:640px"><a class="ba-btn ba-btn--primary ba-btn--lg" href="calibration.html">${ICON.replay}Play again</a><a class="ba-btn ba-btn--secondary ba-btn--lg" href="home.html">Choose another game</a></div></div>
  </div>`;
await ready();
</script>
</body>
</html>
