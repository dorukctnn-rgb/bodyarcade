<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BodyArcade lobbies</title>
<meta name="description" content="UI kit: public lobbies per game. Quick match by level, open lobbies with free seats and level band, strangers shown only as skeletons with preset messages.">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="pages.css">
<style>
  .k-quick { display: grid; gap: 16px; }
  .k-pick { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 8px 14px 8px 8px; border: 0; border-radius: var(--ba-radius-md); background: var(--ba-surface-sunken); color: var(--ba-text); text-align: left; cursor: pointer; font: inherit; }
  .k-pick img { width: 64px; height: 48px; border-radius: 10px; object-fit: cover; }
  .k-pick b { display: block; font-weight: 800; }
  .k-pick small { color: var(--ba-text-muted); font-size: var(--ba-text-xs); }
  .k-pick > svg { width: 22px; height: 22px; }
  .k-ghostnote { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
  .k-ghostnote .pic { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: #1A1430; }
  .k-ghostnote .pic svg { width: 100%; height: 100%; }
  .k-lobbies .full { opacity: 0.55; }
  .k-gamechips { margin-top: 2px; }
  .k-gamechips .ba-chip img { width: 34px; height: 26px; border-radius: 6px; object-fit: cover; }
</style>
</head>
<body class="ba-app no-tabbar" data-long="1">
<main class="ba-page" id="page"></main>
<script type="module" data-wait>
import { mountShell, pageHead, ICON, GAMES, artSrc, ready } from './shell.mjs';
import { ghostArt } from './art.mjs';

mountShell('friends');
const lobbies = [
  ['squat-flap', 'Steady', 2, 4, 'Kestrel'],
  ['squat-flap', 'Gentle', 1, 4, 'Maple'],
  ['squat-flap', 'Strong', 3, 4, 'Orbit'],
  ['squat-flap', 'Steady', 4, 4, 'Lumen'],
];
const dots = (n, of) => `<span class="k-seatdots" aria-label="${n} of ${of} seats taken">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? '' : 'free'}"></i>`).join('')}</span>`;
const page = document.getElementById('page');
page.innerHTML = `
  ${pageHead('Public lobbies', { back: 'home.html' })}
  <p class="k-sub" style="margin-top:2px">Play with people at your level. Anyone you do not know appears as a skeleton and can only send preset messages. No video, no chat.</p>
  <div class="k-cols k-cols--side" style="margin-top:18px">
    <div class="k-stack">
      <div class="ba-filters k-gamechips" role="group" aria-label="Game">${GAMES.filter((g) => g.local2).slice(0, 6).map((g, i) => `<button class="ba-chip" type="button" aria-pressed="${i === 0}"><img src="${artSrc(g.id)}" alt="" width="34" height="26">${g.name}</button>`).join('')}</div>
      <section aria-labelledby="open">
        <header style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px"><h2 id="open" class="k-h3" style="margin:0">Open lobbies for Squat Flap</h2><span class="ba-small">Europe</span></header>
        <ul class="k-lobbies">${lobbies.map(([id, level, n, of, host]) => `<li class="${n >= of ? 'full' : ''}"><img src="${artSrc(id)}" alt="" width="72" height="54"><div><b>${level} level</b><small>${dots(n, of)}${n} of ${of} players<span>Host ${host}</span></small></div>${n >= of ? '<span class="ba-badge">Full</span>' : '<button class="ba-btn ba-btn--secondary" type="button">Join</button>'}</li>`).join('')}</ul>
        <button class="ba-btn ba-btn--quiet" type="button" style="margin-top:10px">${ICON.plus}Start a lobby</button>
      </section>
    </div>
    <aside class="k-stack">
      <section class="k-card k-quick" aria-labelledby="qm">
        <h2 id="qm" class="k-h3" style="margin:0">Quick match</h2>
        <button class="k-pick" type="button"><img src="${artSrc('squat-flap')}" alt="" width="64" height="48"><div><small>Game</small><b>Squat Flap</b></div>${ICON.chevron}</button>
        <div><span class="k-label">Level</span><div class="ba-seg" role="radiogroup" aria-label="Level"><button type="button" role="radio" aria-checked="false">Gentle</button><button type="button" role="radio" aria-checked="true">Steady</button><button type="button" role="radio" aria-checked="false">Strong</button></div></div>
        <button class="ba-btn ba-btn--primary ba-btn--lg" type="button">${ICON.search}Find a match</button>
      </section>
      <section class="k-card k-ghostnote"><span class="pic">${ghostArt({ w: 128, h: 128, pose: 'jack', color: '#46B4FF' })}</span><p>This is how other players see you here: a skeleton in your colour and your display name. Your video never leaves your device.</p></section>
    </aside>
  </div>`;
await ready();
</script>
</body>
</html>
