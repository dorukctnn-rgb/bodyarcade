<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic render</title>
<link rel="stylesheet" href="store.css">
<script type="importmap">{ "imports": { "three": "../../site/vendor/three.module.min.js" } }</script>
<style>
  /* Google Play feature graphic, 1024 x 500. design/tools/render-store.mjs renders it at 2x and
     downscales. Everything that matters sits in the middle 80 %, away from the edges. The 3D court is the stage of the
     welcome tour of the app (design/onboarding/scene.mjs), at the same step. English and Turkish captions: captions.json. */
  html, body { width: 1024px; height: 500px; }
  .fg { position: relative; width: 1024px; height: 500px; overflow: hidden; }
  .stage { position: absolute; right: 0; top: 0; width: 600px; height: 500px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 90px); mask-image: linear-gradient(to right, transparent, #000 90px); }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .copy { position: absolute; left: 104px; top: 50%; transform: translateY(-50%); width: 430px; }
  .copy img { height: 38px; width: auto; margin-bottom: 26px; }
  .copy h1 { font-size: 64px; line-height: 0.96; }
  .copy p { margin-top: 16px; font-size: 25px; font-weight: 700; line-height: 1.25; max-width: 380px; text-wrap: balance; }
  .copy p .ln { color: var(--ba-text); }
</style>
</head>
<body>
<div class="fg">
  <div class="stage"><canvas id="c"></canvas></div>
  <div class="copy cap"><img id="logo" src="../brand/logo.svg" alt="BodyArcade"><h1 id="h"></h1><p id="p"></p></div>
</div>
<script type="module">
import { createStage } from '../onboarding/scene.mjs';
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'light';
const lang = q.get('lang') || 'en';
document.documentElement.dataset.theme = theme;
document.documentElement.lang = lang;
if (theme === 'dark') document.getElementById('logo').src = '../brand/logo-dark.svg';
const all = await (await fetch('captions.json')).json();
const c = all.feature[lang];
const mark = (s) => s.replace(/\*([^*]+)\*/g, '<span class="ln">$1</span>');
document.getElementById('h').innerHTML = mark(c.h);
document.getElementById('p').innerHTML = mark(c.p);
const canvas = document.getElementById('c');
const stage = createStage(canvas, { tier: 2, step: 1, theme, capture: true, reducedMotion: false });
const scale = +(q.get('scale') || 2);
stage.renderer.setPixelRatio(scale);
stage.renderer.setSize(600, 500, false);
stage.setStep(1, { instant: true, logoBand: false });
stage.renderAt(+(q.get('t') || 1.7));
await document.fonts.ready;
await Promise.all([...document.images].filter((i) => !i.complete).map((i) => new Promise((ok) => { i.onload = i.onerror = ok; })));
// The headline takes two lines at the most; a longer one in another language gets a smaller size.
const h = document.getElementById('h'), copy = document.querySelector('.copy');
let fs = 64;
while ((h.offsetHeight > fs * 0.96 * 2.2 || h.scrollWidth > copy.clientWidth + 1) && fs > 40) { fs -= 1; h.style.fontSize = `${fs}px`; }
document.documentElement.dataset.headline = String(fs);
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
