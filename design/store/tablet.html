<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet screenshot render</title>
<link rel="stylesheet" href="store.css">
<style>
  /* Google Play tablet screenshots, 16:9 landscape: laid out as a 960 x 540 stage and photographed at 2x, which is 1920 x 1080
     for the 7-inch set (size=7). The 10-inch set (size=10) is the same stage drawn 4/3 larger, 2560 x 1440. The screen is a
     capture of the real app at the real size of that tablet held sideways (960 x 600 and 1280 x 800, 2x pixels), shown smaller
     than it was taken, never larger. */
  :root { --k: 1; }
  html, body { width: calc(960px * var(--k)); height: calc(540px * var(--k)); }
  .stage { position: relative; width: 960px; height: 540px; overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0;
    background: radial-gradient(70% 90% at 74% 50%, #FFFFFF 0%, color-mix(in srgb, #FFFFFF 0%, var(--ba-bg)) 72%), var(--ba-bg); }
  .cap { position: absolute; left: 52px; top: 50%; width: 254px; transform: translateY(-50%); }
  .cap h1 { font-size: 40px; }
  .cap p { margin-top: 14px; font-size: 18px; text-wrap: balance; }
  .dev { position: absolute; left: 324px; top: 77px; width: 604px; height: 386px; border-radius: 27px; padding: 12px; background: #0E0A1C;
    box-shadow: 0 0 0 1.5px #3B3263, 0 42px 70px -30px rgba(20, 12, 44, 0.55); }
  .dev .screen { width: 580px; height: 362px; border-radius: 15px; overflow: hidden; background: var(--ba-bg); }
  .dev img { width: 580px; height: 362px; object-fit: cover; display: block; }
  .dev::after { content: ""; position: absolute; left: 50%; top: 4.5px; width: 5px; height: 5px; transform: translateX(-50%); border-radius: 50%; background: #2A2350; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const ids = ['promise', 'privacy', 'calibrate', 'games', 'friends', 'modes'];
const n = +(q.get('n') || 1);
const id = ids[n - 1];
const lang = q.get('lang') || 'en';
const size = q.get('size') === '10' ? 10 : 7;
document.documentElement.style.setProperty('--k', size === 10 ? String(4 / 3) : '1');
document.documentElement.lang = lang;
const all = await (await fetch('captions.json')).json();
const c = all.shots[id][lang];
const mark = (s) => s.replace(/\*([^*]+)\*/g, '<span class="ln">$1</span>');
document.getElementById('stage').innerHTML = `<div class="cap" id="cap"><h1 id="h">${mark(c.h)}</h1><p>${mark(c.p)}</p></div><div class="dev"><div class="screen"><img id="screen" alt="" src=".cap/${lang}/tablet${size}/${id}.png"></div></div>`;
const img = document.getElementById('screen');
await new Promise((ok) => { if (img.complete) ok(); else { img.onload = img.onerror = ok; } });
await document.fonts.ready;
// The device is as tall as its capture: a tablet whose picture ends a few pixels higher (the capture tool does that to keep a line of
// text from being cut in half by the bottom edge) is a few pixels less tall. Never stretched: the picture keeps its own proportions.
if (img.naturalWidth) {
  const sh = Math.round(580 * (img.naturalHeight / img.naturalWidth) * 2) / 2;
  const dev = document.querySelector('.dev');
  img.style.height = `${sh}px`;
  document.querySelector('.dev .screen').style.height = `${sh}px`;
  dev.style.height = `${sh + 24}px`;
  dev.style.top = `${(540 - (sh + 24)) / 2}px`;
}
// The caption column is 254 px wide and as tall as the tablet at most.
const cap = document.getElementById('cap'), h = document.getElementById('h');
let fs = 40;
while (cap.offsetHeight > 350 && fs > 26) { fs -= 1; h.style.fontSize = `${fs}px`; }
document.documentElement.dataset.captionHeight = String(cap.offsetHeight);
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
