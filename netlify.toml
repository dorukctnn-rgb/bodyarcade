# Netlify deploy config for BodyArcade.
# Only site/ is published; old builds and working screenshots in the repo root stay private.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"
    # Report-only: the browser logs what the policy would block (DevTools console) and blocks nothing.
    # Switch the name to Content-Security-Policy once normal visits, a camera run and a Pro activation
    # show no reports. 'sha256-...' is the one inline script every page has
    # (document.documentElement.classList.add('js')); 'wasm-unsafe-eval' is for the MediaPipe WASM.
    # When the pose model is self-hosted, drop cdn.jsdelivr.net and storage.googleapis.com.
    # Keep cloudflare/overlay/_headers (PR #14) in step with this line.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://cdn.jsdelivr.net https://plausible.io; connect-src 'self' https://api.gumroad.com https://plausible.io https://cdn.jsdelivr.net https://storage.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# HTML, the service worker and un-fingerprinted scripts/styles must revalidate so
# every player gets a new build on the next load. Pages reference ba.css/app.js with
# a ?v= query as a second safety net.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/game/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/ba.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/ba.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Immutable-by-name assets: the 3D library (renamed on upgrade), fonts and images.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/worlds/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Canonical URLs are extensionless; keep the old .html addresses working.
[[redirects]]
  from = "/BodyArcade.html"
  to = "/bodyarcade"
  status = 301

[[redirects]]
  from = "/play"
  to = "/bodyarcade"
  status = 301

[[redirects]]
  from = "/app"
  to = "/bodyarcade"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/ring-fit-adventure-alternative.html"
  to = "/ring-fit-adventure-alternative"
  status = 301

[[redirects]]
  from = "/webcam-fitness-games.html"
  to = "/webcam-fitness-games"
  status = 301

[[redirects]]
  from = "/blog/why-browser-fitness-games-are-the-future.html"
  to = "/blog/why-browser-fitness-games-are-the-future"
  status = 301

# Old builds that used to be published from the repo root.
[[redirects]]
  from = "/BodyArcade%20v1.html"
  to = "/bodyarcade"
  status = 301

[[redirects]]
  from = "/BodyArcade%20v2-neon.html"
  to = "/bodyarcade"
  status = 301

[[redirects]]
  from = "/uploads/*"
  to = "/"
  status = 301
