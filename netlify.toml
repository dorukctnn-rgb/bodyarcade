# Netlify deploy config for BodyArcade.
# Only site/ is published; old builds and working screenshots in the repo root stay private.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Scripts and styles are not fingerprinted, so they must revalidate or updates never reach players.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/play"
  to = "/BodyArcade.html"
  status = 301

[[redirects]]
  from = "/app"
  to = "/BodyArcade.html"
  status = 301

# Old builds that used to be published from the repo root.
[[redirects]]
  from = "/BodyArcade%20v1.html"
  to = "/BodyArcade.html"
  status = 301

[[redirects]]
  from = "/BodyArcade%20v2-neon.html"
  to = "/BodyArcade.html"
  status = 301

[[redirects]]
  from = "/uploads/*"
  to = "/"
  status = 301
