<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace recorder</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #1b1a17; --muted: #6b675e; --line: #d8d3c8; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --fg: #f1ede4; --muted: #a59f92; --line: #3a3830; --accent: #fb923c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  p { margin: 0; color: var(--muted); }
  .stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, label.file { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=file] { display: none; }
  input[type=text], select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  #status, #stats { font: 13px/1.4 ui-monospace, monospace; color: var(--muted); min-height: 1.4em; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>Trace recorder</h1>
  <p>Records pose landmarks (never video) for detector and calibration tests. Everything stays in this browser until you download the file.</p>
  <div class="row">
    <button id="b-camera" class="primary" type="button">Use camera</button>
    <label class="file">Open video file<input id="f-video" type="file" accept="video/*"></label>
    <input id="t-id" type="text" value="trace" aria-label="Trace name" spellcheck="false">
    <select id="s-framing" aria-label="Framing"><option value="full">Full body</option><option value="upper">Upper body</option><option value="side">Side view</option></select>
  </div>
  <div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
  <div class="row">
    <button id="b-rec" type="button" disabled>Record</button>
    <button id="b-stop" type="button" disabled>Stop</button>
    <button id="b-analyse" type="button" disabled>Analyse file frame by frame</button>
    <button id="b-save" type="button" disabled>Download trace</button>
  </div>
  <p>Labels while recording: <kbd>J</kbd> jump, <kbd>S</kbd> squat, <kbd>K</kbd> knee lift, <kbd>A</kbd> lean left, <kbd>D</kbd> lean right, <kbd>Space</kbd> still.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="stats"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
